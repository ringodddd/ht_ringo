<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>幕译</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <strong>幕译</strong>
      <span>用 Safari 打开油管，字幕写在播放器上。全屏也能看见。</span>
    </header>
    <label>API Base URL<input id="apiBase" placeholder="https://api.deepseek.com/v1" spellcheck="false" autocapitalize="off" /></label>
    <label>API Key<input id="apiKey" type="password" placeholder="只留在这台手机里" autocomplete="off" /></label>
    <label>模型<input id="model" placeholder="deepseek-chat" spellcheck="false" autocapitalize="off" /></label>
    <div class="row">
      <label>译成
        <select id="targetLang">
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁体中文</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
          <option value="es">西班牙语</option>
          <option value="fr">法语</option>
          <option value="de">德语</option>
        </select>
      </label>
      <label>源字幕
        <select id="sourceLang">
          <option value="auto">自动，优先人工字幕</option>
          <option value="en">英语</option>
          <option value="zh-Hans">中文</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
        </select>
      </label>
    </div>
    <label>字幕内容
      <select id="displayMode">
        <option value="bilingual">双语，原文在上</option>
        <option value="translation">只看译文</option>
        <option value="original">只看原文</option>
      </select>
    </label>
    <label class="check"><input id="translationBelow" type="checkbox" /> 译文放在原文下面</label>
    <label>补充要求<textarea id="extraPrompt" rows="3" placeholder="例如：技术词保留英文"></textarea></label>
    <p class="note">字号和底色跟 iPhone 的系统字幕走：设置 → 辅助功能 → 字幕与隐藏式字幕。</p>
    <p id="status"></p>
    <button id="save" type="button">保存</button>
    <script src="popup.js"></script>
  </body>
</html>
